<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary vs Linear Search Race</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
            gap: 8px;
        }
        .cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            border-radius: 0.375rem;
            transition: all 0.3s ease;
            position: relative;
        }
        .pointer-container {
            position: absolute;
            bottom: 2px;
            display: flex;
            gap: 2px;
            font-size: 0.65rem;
            font-weight: 800;
            line-height: 1;
        }
        @media (max-width: 640px) {
            .cell { font-size: 0.9rem; }
            .grid-container { grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold" id="app-title">搜尋演算法：二分搜尋 vs 線性搜尋</h1>
        <button id="lang-toggle" class="bg-white text-blue-600 px-3 py-1 rounded font-semibold hover:bg-blue-50 transition">
            English
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-6xl mx-auto w-full p-6 space-y-6">
        
        <!-- Explanations Section -->
        <section class="bg-white rounded-xl shadow-sm p-5 border border-slate-200">
            <h2 class="text-xl font-bold text-blue-700 mb-4" id="theory-title">概念理解</h2>
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-100">
                    <h3 class="font-bold text-lg mb-2 text-slate-700" id="linear-title">線性搜尋 (Linear Search)</h3>
                    <p class="text-sm text-slate-600" id="linear-desc">從第一個元素開始逐一檢查。適用於未排序的資料，但速度較慢。</p>
                </div>
                <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                    <h3 class="font-bold text-lg mb-2 text-blue-800" id="binary-title">二分搜尋 (Binary Search)</h3>
                    <p class="text-sm text-slate-600" id="binary-desc">每次挑選中間值比較，直接淘汰一半的資料。速度極快，但資料必須先排序。</p>
                </div>
            </div>
        </section>

        <!-- Interactive Race Section -->
        <section class="bg-white rounded-xl shadow-sm p-6 border border-slate-200">
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                <h2 class="text-xl font-bold text-blue-700" id="race-title">大賽跑：1 到 31</h2>
                
                <div class="flex flex-wrap items-center justify-center gap-3">
                    <label for="target-input" class="font-semibold" id="target-label">目標數字 (1-31)：</label>
                    <input type="number" id="target-input" min="1" max="31" value="23" class="border border-slate-300 rounded px-3 py-1 w-20 text-center focus:outline-none focus:border-blue-500 font-bold">
                    
                    <button id="start-btn" class="bg-green-500 text-white px-4 py-2 rounded font-bold hover:bg-green-600 transition shadow-sm w-24">
                        開始
                    </button>
                    <button id="step-btn" class="bg-amber-500 text-white px-4 py-2 rounded font-bold hover:bg-amber-600 transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        單步執行
                    </button>
                    <button id="reset-btn" class="bg-slate-200 text-slate-700 px-4 py-2 rounded font-bold hover:bg-slate-300 transition shadow-sm">
                        重置
                    </button>
                </div>
            </div>

            <!-- Side by Side Tracks -->
            <div class="grid md:grid-cols-2 gap-8">
                
                <!-- Linear Search Track -->
                <div class="flex flex-col">
                    <div class="flex justify-between items-end mb-2">
                        <h3 class="font-bold text-slate-700 text-lg" id="linear-track-title">線性搜尋跑道</h3>
                        <span class="text-sm font-mono bg-slate-100 px-2 py-1 rounded font-bold" id="linear-steps">步數: 0</span>
                    </div>
                    <div id="linear-grid" class="grid-container bg-slate-100 p-4 rounded-lg border border-slate-200 mb-3"></div>
                    <!-- Linear Status -->
                    <div class="bg-slate-50 p-3 rounded border border-slate-200 min-h-[60px] flex items-center justify-center text-center text-sm font-medium text-slate-600 transition-colors" id="linear-status">
                        等待開始...
                    </div>
                </div>

                <!-- Binary Search Track -->
                <div class="flex flex-col">
                    <div class="flex justify-between items-end mb-2">
                        <h3 class="font-bold text-blue-800 text-lg" id="binary-track-title">二分搜尋跑道</h3>
                        <span class="text-sm font-mono bg-blue-50 px-2 py-1 rounded font-bold text-blue-700" id="binary-steps">步數: 0</span>
                    </div>
                    <div id="binary-grid" class="grid-container bg-slate-100 p-4 rounded-lg border border-slate-200 mb-3"></div>
                    <!-- Binary Status -->
                    <div class="bg-blue-50 p-3 rounded border border-blue-200 min-h-[60px] flex items-center justify-center text-center text-sm font-medium text-blue-800 transition-colors" id="binary-status">
                        等待開始...
                    </div>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 text-slate-400 py-4 text-center text-sm mt-auto">
        <p>Created by Sam Li</p>
    </footer>

    <script>
        const MAX_NUM = 31;
        let currentLang = 'zh';
        
        // Animation State
        let isRunning = false;
        let isPaused = false;
        let hasStarted = false;
        let linearTimer = null;
        let binaryTimer = null;
        let target = 23;

        // Linear State
        let lState = { current: 1, steps: 0, finished: false };
        
        // Binary State
        let bState = { left: 1, right: MAX_NUM, steps: 0, phase: 'calc', mid: 0, finished: false };

        const dict = {
            en: {
                appTitle: "Search Algorithms: Binary vs Linear",
                langToggle: "中文",
                theoryTitle: "Understanding the Concepts",
                linearTitle: "Linear Search",
                linearDesc: "Checks elements one by one from the start. Works on unsorted data, but is slower.",
                binaryTitle: "Binary Search",
                binaryDesc: "Checks the middle value and eliminates half the data each time. Extremely fast, but requires sorted data.",
                raceTitle: `The Great Race: 1 to ${MAX_NUM}`,
                targetLabel: `Target (1-${MAX_NUM}):`,
                startBtn: "Start",
                pauseBtn: "Pause",
                resumeBtn: "Resume",
                stepBtn: "Next Step",
                resetBtn: "Reset",
                linearTrackTitle: "Linear Search",
                binaryTrackTitle: "Binary Search",
                steps: "Steps: ",
                statusWait: "Waiting to start...",
                linCheck: (curr) => `Checking if ${curr} is the target...`,
                linFound: (curr) => `Found ${curr}!`,
                binCalc: (l, r, m) => `Range is ${l}-${r}. Middle is ${m}.`,
                binCheck: (m, t) => `${m} is not ${t}.`,
                binElimLeft: (m) => `Target is larger. Eliminating ${m} and left side.`,
                binElimRight: (m) => `Target is smaller. Eliminating ${m} and right side.`,
                binFound: (m) => `Found ${m} at the middle!`,
                binNotFound: "Target not found in data."
            },
            zh: {
                appTitle: "搜尋演算法：二分搜尋 vs 線性搜尋",
                langToggle: "English",
                theoryTitle: "概念理解",
                linearTitle: "線性搜尋 (Linear Search)",
                linearDesc: "從第一個元素開始逐一檢查。適用於未排序的資料，但速度較慢。",
                binaryTitle: "二分搜尋 (Binary Search)",
                binaryDesc: "每次挑選中間值比較，直接淘汰一半的資料。速度極快，但資料必須先排序。",
                raceTitle: `大賽跑：1 到 ${MAX_NUM}`,
                targetLabel: `目標數字 (1-${MAX_NUM})：`,
                startBtn: "開始",
                pauseBtn: "暫停",
                resumeBtn: "繼續",
                stepBtn: "單步執行",
                resetBtn: "重置",
                linearTrackTitle: "線性搜尋跑道",
                binaryTrackTitle: "二分搜尋跑道",
                steps: "步數: ",
                statusWait: "等待開始...",
                linCheck: (curr) => `檢查 ${curr} 是否為目標...`,
                linFound: (curr) => `找到 ${curr} 了！`,
                binCalc: (l, r, m) => `目前範圍 ${l} 到 ${r}，中間值為 ${m}`,
                binCheck: (m, t) => `${m} 不是 ${t}`,
                binElimLeft: (m) => `目標比 ${m} 大，排除左半邊`,
                binElimRight: (m) => `目標比 ${m} 小，排除右半邊`,
                binFound: (m) => `在中間找到了 ${m}！`,
                binNotFound: "資料中找不到目標。"
            }
        };

        const els = {
            appTitle: document.getElementById('app-title'),
            langToggle: document.getElementById('lang-toggle'),
            theoryTitle: document.getElementById('theory-title'),
            linearTitle: document.getElementById('linear-title'),
            linearDesc: document.getElementById('linear-desc'),
            binaryTitle: document.getElementById('binary-title'),
            binaryDesc: document.getElementById('binary-desc'),
            raceTitle: document.getElementById('race-title'),
            targetLabel: document.getElementById('target-label'),
            startBtn: document.getElementById('start-btn'),
            stepBtn: document.getElementById('step-btn'),
            resetBtn: document.getElementById('reset-btn'),
            linearTrackTitle: document.getElementById('linear-track-title'),
            binaryTrackTitle: document.getElementById('binary-track-title'),
            linearSteps: document.getElementById('linear-steps'),
            binarySteps: document.getElementById('binary-steps'),
            targetInput: document.getElementById('target-input'),
            linearGrid: document.getElementById('linear-grid'),
            binaryGrid: document.getElementById('binary-grid'),
            linearStatus: document.getElementById('linear-status'),
            binaryStatus: document.getElementById('binary-status')
        };

        function updateLanguage() {
            const t = dict[currentLang];
            els.appTitle.textContent = t.appTitle;
            els.langToggle.textContent = t.langToggle;
            els.theoryTitle.textContent = t.theoryTitle;
            els.linearTitle.textContent = t.linearTitle;
            els.linearDesc.textContent = t.linearDesc;
            els.binaryTitle.textContent = t.binaryTitle;
            els.binaryDesc.textContent = t.binaryDesc;
            els.raceTitle.textContent = t.raceTitle;
            els.targetLabel.textContent = t.targetLabel;
            
            if (!hasStarted) els.startBtn.textContent = t.startBtn;
            else if (isPaused) els.startBtn.textContent = t.resumeBtn;
            else els.startBtn.textContent = t.pauseBtn;
            
            els.stepBtn.textContent = t.stepBtn;
            els.resetBtn.textContent = t.resetBtn;
            els.linearTrackTitle.textContent = t.linearTrackTitle;
            els.binaryTrackTitle.textContent = t.binaryTrackTitle;
            
            els.linearSteps.textContent = t.steps + lState.steps;
            els.binarySteps.textContent = t.steps + bState.steps;

            if(!hasStarted) {
                els.linearStatus.textContent = t.statusWait;
                els.binaryStatus.textContent = t.statusWait;
            }
        }

        function createGrids() {
            els.linearGrid.innerHTML = '';
            els.binaryGrid.innerHTML = '';
            for (let i = 1; i <= MAX_NUM; i++) {
                const lCell = document.createElement('div');
                lCell.className = 'cell bg-white text-slate-600 border border-slate-300 font-semibold shadow-sm';
                lCell.id = `l-${i}`;
                lCell.innerHTML = `<span>${i}</span>`;
                els.linearGrid.appendChild(lCell);

                const bCell = document.createElement('div');
                bCell.className = 'cell bg-white text-slate-600 border border-slate-300 font-semibold shadow-sm';
                bCell.id = `b-${i}`;
                
                // Redesigned pointer container inside the cell
                bCell.innerHTML = `
                    <span class="mt-[-8px]">${i}</span>
                    <div class="pointer-container" id="bp-${i}"></div>
                `;
                els.binaryGrid.appendChild(bCell);
            }
        }

        function clearPointers() {
            for (let i = 1; i <= MAX_NUM; i++) {
                document.getElementById(`bp-${i}`).innerHTML = '';
            }
        }

        function drawPointers() {
            clearPointers();
            if(bState.left <= MAX_NUM && bState.left >= 1) {
                document.getElementById(`bp-${bState.left}`).innerHTML += `<span class="text-blue-600">L</span>`;
            }
            if(bState.right >= 1 && bState.right <= MAX_NUM) {
                document.getElementById(`bp-${bState.right}`).innerHTML += `<span class="text-blue-600">R</span>`;
            }
            if(bState.mid >= 1 && bState.mid <= MAX_NUM && bState.phase !== 'calc') {
                document.getElementById(`bp-${bState.mid}`).innerHTML += `<span class="text-red-500">M</span>`;
            }
        }

        function resetRace() {
            clearInterval(linearTimer);
            clearInterval(binaryTimer);
            isRunning = false;
            isPaused = false;
            hasStarted = false;
            
            lState = { current: 1, steps: 0, finished: false };
            bState = { left: 1, right: MAX_NUM, steps: 0, phase: 'calc', mid: 0, finished: false };
            
            els.targetInput.disabled = false;
            els.stepBtn.disabled = true;
            
            els.linearStatus.classList.remove('bg-green-100', 'text-green-700');
            els.binaryStatus.classList.remove('bg-green-100', 'text-green-700');
            els.linearStatus.classList.add('bg-slate-50', 'text-slate-600');
            els.binaryStatus.classList.add('bg-blue-50', 'text-blue-800');

            for (let i = 1; i <= MAX_NUM; i++) {
                const lCell = document.getElementById(`l-${i}`);
                const bCell = document.getElementById(`b-${i}`);
                lCell.className = 'cell bg-white text-slate-600 border border-slate-300 font-semibold shadow-sm';
                bCell.className = 'cell bg-white text-slate-600 border border-slate-300 font-semibold shadow-sm';
            }
            clearPointers();
            updateLanguage();
        }

        function stepLinear() {
            if (lState.finished) return;
            const t = dict[currentLang];

            if (lState.current > 1) {
                const prev = document.getElementById(`l-${lState.current - 1}`);
                if (lState.current - 1 !== target) {
                    prev.classList.replace('bg-yellow-300', 'bg-slate-100');
                    prev.classList.add('opacity-50');
                }
            }

            lState.steps++;
            els.linearSteps.textContent = t.steps + lState.steps;
            const currCell = document.getElementById(`l-${lState.current}`);
            
            if (lState.current === target) {
                currCell.classList.replace('bg-white', 'bg-green-500');
                currCell.classList.replace('text-slate-600', 'text-white');
                currCell.classList.add('scale-110', 'shadow-md', 'z-10');
                els.linearStatus.textContent = t.linFound(lState.current);
                els.linearStatus.classList.replace('bg-slate-50', 'bg-green-100');
                els.linearStatus.classList.replace('text-slate-600', 'text-green-700');
                lState.finished = true;
            } else {
                currCell.classList.replace('bg-white', 'bg-yellow-300');
                els.linearStatus.textContent = t.linCheck(lState.current);
                lState.current++;
            }
        }

        function stepBinary() {
            if (bState.finished) return;
            const t = dict[currentLang];

            if (bState.left > bState.right) {
                els.binaryStatus.textContent = t.binNotFound;
                bState.finished = true;
                return;
            }

            if (bState.phase === 'calc') {
                bState.steps++;
                els.binarySteps.textContent = t.steps + bState.steps;
                bState.mid = Math.floor((bState.left + bState.right) / 2);
                
                drawPointers();
                const midCell = document.getElementById(`b-${bState.mid}`);
                midCell.classList.replace('bg-white', 'bg-blue-400');
                midCell.classList.replace('text-slate-600', 'text-white');
                midCell.classList.add('scale-110', 'shadow-md', 'z-10');
                
                els.binaryStatus.textContent = t.binCalc(bState.left, bState.right, bState.mid);
                bState.phase = 'check';
            } 
            else if (bState.phase === 'check') {
                const midCell = document.getElementById(`b-${bState.mid}`);
                if (bState.mid === target) {
                    midCell.classList.replace('bg-blue-400', 'bg-green-500');
                    els.binaryStatus.textContent = t.binFound(bState.mid);
                    els.binaryStatus.classList.replace('bg-blue-50', 'bg-green-100');
                    els.binaryStatus.classList.replace('text-blue-800', 'text-green-700');
                    bState.finished = true;
                } else {
                    els.binaryStatus.textContent = t.binCheck(bState.mid, target);
                    bState.phase = 'eliminate';
                }
            }
            else if (bState.phase === 'eliminate') {
                const midCell = document.getElementById(`b-${bState.mid}`);
                midCell.classList.remove('scale-110', 'shadow-md', 'z-10');
                midCell.classList.replace('bg-blue-400', 'bg-slate-200');
                midCell.classList.replace('text-white', 'text-slate-400');

                if (bState.mid < target) {
                    els.binaryStatus.textContent = t.binElimLeft(bState.mid);
                    for (let i = bState.left; i <= bState.mid; i++) {
                        const c = document.getElementById(`b-${i}`);
                        c.className = 'cell bg-slate-100 text-slate-300 border border-slate-200 opacity-40';
                    }
                    bState.left = bState.mid + 1;
                } else {
                    els.binaryStatus.textContent = t.binElimRight(bState.mid);
                    for (let i = bState.mid; i <= bState.right; i++) {
                        const c = document.getElementById(`b-${i}`);
                        c.className = 'cell bg-slate-100 text-slate-300 border border-slate-200 opacity-40';
                    }
                    bState.right = bState.mid - 1;
                }
                bState.phase = 'calc';
                drawPointers();
            }
        }

        function toggleRace() {
            let parsedTarget = parseInt(els.targetInput.value);
            if (isNaN(parsedTarget) || parsedTarget < 1 || parsedTarget > MAX_NUM) {
                alert(currentLang === 'en' ? `Please enter a number between 1 and ${MAX_NUM}.` : `請輸入 1 到 ${MAX_NUM} 之間的數字。`);
                return;
            }
            target = parsedTarget;

            if (!hasStarted) {
                // Initial Start
                hasStarted = true;
                els.targetInput.disabled = true;
                els.stepBtn.disabled = true;
                els.startBtn.classList.replace('bg-green-500', 'bg-red-500');
                els.startBtn.classList.replace('hover:bg-green-600', 'hover:bg-red-600');
                resumeRace();
            } else if (isRunning) {
                // Pause
                pauseRace();
            } else {
                // Resume
                resumeRace();
            }
            updateLanguage();
        }

        function pauseRace() {
            clearInterval(linearTimer);
            clearInterval(binaryTimer);
            isRunning = false;
            isPaused = true;
            els.stepBtn.disabled = false;
            els.startBtn.classList.replace('bg-red-500', 'bg-green-500');
            els.startBtn.classList.replace('hover:bg-red-600', 'hover:bg-green-600');
        }

        function resumeRace() {
            isRunning = true;
            isPaused = false;
            els.stepBtn.disabled = true;
            els.startBtn.classList.replace('bg-green-500', 'bg-red-500');
            els.startBtn.classList.replace('hover:bg-green-600', 'hover:bg-red-600');
            
            // Start intervals
            linearTimer = setInterval(() => {
                stepLinear();
                if (lState.finished && bState.finished) pauseRace();
            }, 300);

            binaryTimer = setInterval(() => {
                stepBinary();
                if (lState.finished && bState.finished) pauseRace();
            }, 1200);
        }

        function stepManual() {
            if (isRunning) return;
            stepLinear();
            stepBinary();
        }

        els.langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            updateLanguage();
        });

        els.startBtn.addEventListener('click', toggleRace);
        els.stepBtn.addEventListener('click', stepManual);
        els.resetBtn.addEventListener('click', () => {
            resetRace();
            els.startBtn.classList.remove('bg-red-500', 'hover:bg-red-600');
            els.startBtn.classList.add('bg-green-500', 'hover:bg-green-600');
        });

        createGrids();
        updateLanguage();

    </script>
</body>
</html>
